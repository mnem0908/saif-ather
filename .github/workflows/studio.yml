name: Studio
run-name: studio ${{ inputs.handover == 'true' && '(handover)' || '' }}

on:
  workflow_dispatch:
    inputs:
      handover: { description: 'Set by the previous run when taking over', required: false, default: 'false' }
  schedule:
    - cron: '23 */6 * * *'   # watchdog: restarts the chain if it ever broke (does nothing if a run is active)

permissions:
  contents: write
  actions: write

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run studio and publish link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SA_KEY: ${{ secrets.SA_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HANDOVER: ${{ inputs.handover }}
        run: bash scripts/studio-run.sh
