name: Render video
run-name: render ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:     { description: 'Job id (used to find this run)', required: true }
      job_url:    { description: 'Studio job JSON url (code+props+media)', required: false, default: '' }
      frames:     { description: 'Exact total frames (studio mode)', required: false, default: '' }
      crf:        { description: 'x264 CRF', required: false, default: '18' }
      preset:     { description: 'x264 preset', required: false, default: 'medium' }
      mediaUrl:   { description: 'Public URL of uploaded media (template mode)', required: false, default: '' }
      title:      { description: 'Video title (template mode)', required: false, default: 'SA Motion Studio' }
      duration:   { description: 'Duration in seconds', required: true,  default: '10' }
      template:   { description: 'title | showcase | captions | videoedit (template mode)', required: false, default: 'title' }
      mediaType:  { description: 'video | audio | empty', required: false, default: '' }
      width:      { description: 'Width',  required: false, default: '1080' }
      height:     { description: 'Height', required: false, default: '1920' }
      fps:        { description: 'FPS',    required: false, default: '30' }
      segments:   { description: 'Caption segments JSON (template mode)', required: false, default: '[]' }
      chunks:     { description: 'Number of parallel machines (max 20)', required: false, default: '8' }

env:
  IN_JOB: ${{ inputs.job_url }}
  IN_FRAMES: ${{ inputs.frames }}
  IN_CRF: ${{ inputs.crf }}
  IN_PRESET: ${{ inputs.preset }}
  IN_MEDIA: ${{ inputs.mediaUrl }}
  IN_TITLE: ${{ inputs.title }}
  IN_TEMPLATE: ${{ inputs.template }}
  IN_MTYPE: ${{ inputs.mediaType }}
  IN_DUR: ${{ inputs.duration }}
  IN_W: ${{ inputs.width }}
  IN_H: ${{ inputs.height }}
  IN_FPS: ${{ inputs.fps }}
  IN_SEG: ${{ inputs.segments }}
  IN_CHUNKS: ${{ inputs.chunks }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: bash scripts/plan.sh

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji fonts-hosny-amiri libnss3 libgbm1 libasound2t64 || true
          fc-cache -f
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: bash scripts/prepare.sh
      - name: Render chunk ${{ matrix.chunk.i }} (${{ matrix.chunk.range }})
        run: npx remotion render src/index.ts MainVideo out/chunk-${{ matrix.chunk.i }}.mp4 --props=./props.json --frames=${{ matrix.chunk.range }} --muted --gl=swangle --disable-web-security --codec=h264 --crf=${IN_CRF:-18} --x264-preset=${IN_PRESET:-medium} --timeout=180000
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ inputs.job_id }}-${{ matrix.chunk.i }}
          path: out/chunk-${{ matrix.chunk.i }}.mp4
          retention-days: 1

  audio:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libgbm1 libasound2t64 || true
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: bash scripts/prepare.sh
      - run: npx remotion render src/index.ts MainVideo out/audio.aac --props=./props.json --codec=aac --gl=swangle --disable-web-security --timeout=180000
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ inputs.job_id }}
          path: out/audio.aac
          retention-days: 1

  merge:
    needs: [plan, render, audio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-${{ inputs.job_id }}-*
          path: chunks
      - uses: actions/download-artifact@v4
        with:
          name: audio-${{ inputs.job_id }}
          path: audio
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Stitch (no re-encode) and add audio
        run: |
          ls chunks/*/chunk-*.mp4 | sed 's/.*chunk-\([0-9]*\)\.mp4/\1 &/' | sort -n | awk '{print "file \x27" $2 "\x27"}' > list.txt
          cat list.txt
          ffmpeg -y -v error -f concat -safe 0 -i list.txt -c copy video-only.mp4
          mkdir -p out
          ffmpeg -y -v error -i video-only.mp4 -i audio/audio.aac -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest out/video.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.job_id }}
          path: out/video.mp4
          retention-days: 2
